{% if post.date or post.tags %}
<p class="meta">
  {% if post.date %}
  <time datetime="{{ post.date.isoformat() }}">{{ post.date.strftime("%b") }} {{ post.date.day }}, {{ post.date.year }}</time>
  {% endif %}
  {% for tag in post.tags %}<span class="tag">#{{ tag }}</span>{% endfor %}
</p>
{% endif %}
