<!doctype html>
<html lang="{{ site.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.extra.get('summary') or site.description }}">
  {% if site.base_url %}<link rel="canonical" href="{{ site.base_url }}{{ page.url }}">{% endif %}
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  {% include "partials/header.html" %}
  <main>
    {% block main %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
</body>
</html>
