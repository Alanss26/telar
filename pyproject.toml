[project]
name = "telar"
version = "0.1.0"
description = "A small static site generator: Markdown in, HTML out."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alan Joseph Salazar Segura" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.14.1",
    "python-frontmatter>=1.3.0",
    "typer>=0.27.3",
    "watchfiles>=1.3.0",
]

[project.scripts]
telar = "telar.cli:app"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]
